function fmt(b) {
  const u = ['B','KiB','MiB','GiB','TiB','PiB']; let i = 0; b = Number(b);
  while (Math.abs(b) >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return i === 0 ? b + ' B' : b.toFixed(1) + ' ' + u[i];
}
function num(n) { return Number(n).toLocaleString(); }
function mk(tag, cls, text) {
  const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e;
}

DATA.groups.forEach(g => {
  g.copies = g.files.length;
  g.reclaimable = g.size * (g.copies - 1);
  g.assets = new Set(g.files.map(f => f.ref)).size;
  g.search = g.files.map(f => [f.filename, f.title, (f.path || []).join(' / '), f.ref].join(' ')).join(' ').toLowerCase()
             + ' ' + (g.fixity || '');
});

(function header() {
  const box = document.getElementById('source');
  for (const [label, value] of [['Tenancy', DATA.tenant], ['Server', DATA.server]]) {
    if (!value) continue;
    const d = mk('div'); d.appendChild(mk('span', '', label)); d.appendChild(mk('b', '', value)); box.appendChild(d);
  }
  const s = DATA.summary;
  document.getElementById('title').textContent = 'Duplicate content';
  document.getElementById('scope').textContent = 'Scope: ' + (DATA.scope || 'Repository') +
    ' · ' + (s.representations || []).join(' and ') + ' representations';
  const tiles = [
    ['Reclaimable space', fmt(s.reclaimable), true],
    ['Duplicate files', num(s.duplicates) + ' extra copies'],
    ['Duplicate groups', num(s.groups)],
    ['Files scanned', num(s.files) + ' · ' + fmt(s.bytes)],
    ['Assets scanned', num(s.assets)],
  ];
  const t = document.getElementById('tiles');
  for (const [label, value, key] of tiles) {
    const d = mk('div', 'tile' + (key ? ' key' : '')); d.appendChild(mk('div', 'v', value)); d.appendChild(mk('div', 'l', label));
    t.appendChild(d);
  }
  const notes = [];
  if (s.bytes) notes.push(`Extra copies use ${(100 * s.reclaimable / s.bytes).toFixed(2)}% of the scanned storage.`);
  if (s.no_fixity) notes.push(`${num(s.no_fixity)} files had no fixity value and could not be compared.`);
  if (s.failed) notes.push(`${num(s.failed)} assets could not be read.`);
  if (s.min_size > 1) notes.push(`Files smaller than ${fmt(s.min_size)} were ignored.`);
  else if (s.min_size === 1) notes.push('Empty files were ignored.');
  document.getElementById('notes').textContent = notes.join(' ');
  document.getElementById('footer').textContent = DATA.scanned ? 'Scanned ' + DATA.scanned.replace('T', ' ') : '';
})();

function groupCard(g) {
  const d = mk('details');
  const s = mk('summary');
  s.appendChild(mk('span', 'caret', '▶'));
  const names = new Set(g.files.map(f => f.filename));
  s.appendChild(mk('span', 'name', g.files[0].filename + (names.size > 1 ? ` (+${names.size - 1} other name${names.size > 2 ? 's' : ''})` : '')));
  s.appendChild(mk('span', 'chip', `${g.copies} copies`));
  s.appendChild(mk('span', 'chip', `${fmt(g.size)} each`));
  s.appendChild(mk('span', 'chip warn', `${fmt(g.reclaimable)} reclaimable`));
  if (g.assets === 1) s.appendChild(mk('span', 'same', 'all in one asset'));
  d.appendChild(s);
  d.addEventListener('toggle', () => {
    if (!d.open || d.dataset.filled) return;
    d.dataset.filled = '1';
    if (g.fixity) d.appendChild(mk('div', 'fix', `${g.algorithm}: ${g.fixity}`));
    const list = mk('div', 'copies');
    const head = mk('div', 'copy head');
    ['Filename', 'Asset', 'Folder', 'Representation'].forEach(h => head.appendChild(mk('div', '', h)));
    list.appendChild(head);
    for (const f of g.files) {
      const row = mk('div', 'copy');
      row.appendChild(mk('div', '', f.filename || ''));
      const a = mk('div', '', f.title || '(untitled)'); a.appendChild(mk('span', 'ref', f.ref || '')); row.appendChild(a);
      row.appendChild(mk('div', '', (f.path || []).join(' / ') || '(top level)'));
      row.appendChild(mk('div', 'rep', f.rep || ''));
      list.appendChild(row);
    }
    d.appendChild(list);
  });
  return d;
}

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const key = document.getElementById('sort').value;
  filtered = DATA.groups.filter(g => !q || g.search.includes(q));
  filtered.sort((a, b) => b[key] - a[key] || b.reclaimable - a.reclaimable);
  const box = document.getElementById('groups'); box.innerHTML = '';
  if (!DATA.groups.length) {
    box.appendChild(mk('div', 'empty', 'No duplicate content was found.'));
  } else if (!filtered.length) {
    box.appendChild(mk('div', 'empty', 'No duplicate groups match the filter.'));
  }
  filtered.slice(0, shown).forEach(g => box.appendChild(groupCard(g)));
  const more = document.getElementById('more');
  more.hidden = filtered.length <= shown;
  more.textContent = `Show more (${num(filtered.length - shown)} remaining)`;
  const reclaim = filtered.reduce((s, g) => s + g.reclaimable, 0);
  document.getElementById('count').textContent =
    `${num(filtered.length)} group${filtered.length === 1 ? '' : 's'} · ${fmt(reclaim)} reclaimable`;
}

document.getElementById('q').addEventListener('input', () => { shown = PAGE; render(); });
document.getElementById('sort').addEventListener('change', () => { shown = PAGE; render(); });
document.getElementById('more').addEventListener('click', () => { shown += PAGE; render(); });
render();
</script>
</body>
</html>
